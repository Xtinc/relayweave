<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RelayWeave Dashboard</title>
<style>
  .viz-root {
    color-scheme:light;
    --page-plane:#f5f6f8; --surface-1:#f8fafb; --surface-2:#fff;
    --text-primary:#202832; --text-secondary:#606b78; --text-muted:#8a939e;
    --border:#e6e9ee; --baseline:#cbd2db; --gridline:#edf0f4;
    --series-1:#477dc1; --series-2:#cd8651; --series-4:#a78b47;
    --series-5:#ae709c; --series-6:#388e7c;
    --status-good:#388e7c; --status-warning:#bf9042; --status-critical:#c56b72; --status-neutral:#929ba7;
    --shadow:0 4px 18px #20283208;
    --flow-bg:#fbfcfd; --flow-node-bg:#fff; --flow-ink:var(--text-primary); --flow-muted:var(--text-muted);
    --flow-ring:#cbd5df; --flow-grid:#b4c0ce32;
    --flow-good:var(--status-good); --flow-warning:var(--status-warning); --flow-critical:var(--status-critical);
  }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) .viz-root {
      color-scheme:dark;
      --page-plane:#11151a; --surface-1:#1a2028; --surface-2:#1d242d;
      --text-primary:#e3e8ef; --text-secondary:#a2adba; --text-muted:#778594;
      --border:#2d3743; --baseline:#4a5767; --gridline:#2b3440;
      --series-1:#6f9dd6; --series-2:#d69a6d; --series-4:#b9a46b;
      --series-5:#c58ab1; --series-6:#64b39e;
      --status-good:#64b39e; --status-warning:#d2a75e; --status-critical:#db8b91;
      --shadow:none; --flow-bg:#171d24; --flow-node-bg:#202933;
      --flow-ring:#485b70; --flow-grid:#91a7c321;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme:dark;
    --page-plane:#11151a; --surface-1:#1a2028; --surface-2:#1d242d;
    --text-primary:#e3e8ef; --text-secondary:#a2adba; --text-muted:#778594;
    --border:#2d3743; --baseline:#4a5767; --gridline:#2b3440;
    --series-1:#6f9dd6; --series-2:#d69a6d; --series-4:#b9a46b;
    --series-5:#c58ab1; --series-6:#64b39e;
    --status-good:#64b39e; --status-warning:#d2a75e; --status-critical:#db8b91;
    --shadow:none; --flow-bg:#171d24; --flow-node-bg:#202933;
    --flow-ring:#485b70; --flow-grid:#91a7c321;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--page-plane); color:var(--text-primary); font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  .viz-root { min-height:100vh; }
  button,select { font:inherit; }
  button { color:inherit; }
  button,select,input { accent-color:var(--status-good); }
  button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible { outline:2px solid var(--series-1); outline-offset:3px; }
  .icon { display:block; width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .icon-defs { position:absolute; width:0; height:0; overflow:hidden; }
  .topbar { height:72px; border-bottom:1px solid var(--border); background:var(--surface-2); }
  .topbar-inner { max-width:1488px; height:100%; padding:0 32px; margin:auto; display:flex; align-items:center; gap:20px; }
  .brand { display:flex; align-items:center; gap:11px; }
  .brand-mark { width:30px; height:30px; color:var(--status-good); }
  .topbar h1 { margin:0; font-size:17px; font-weight:650; letter-spacing:-.45px; }
  .spacer { flex:1; }
  .peer { color:var(--text-secondary); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  .conn-badge { display:inline-flex; align-items:center; gap:7px; color:var(--text-secondary); white-space:nowrap; font-size:12px; font-variant-numeric:tabular-nums; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--status-neutral); flex:none; }
  .conn-badge[data-state="connected"] .dot { background:var(--status-good); }
  .conn-badge[data-state="connecting"] .dot { background:var(--status-warning); }
  .conn-badge[data-state="disconnected"] .dot { background:var(--status-critical); }
  main { max-width:1488px; margin:auto; padding:28px 32px 40px; }
  .card { min-width:0; border:1px solid var(--border); border-radius:14px; background:var(--surface-2); box-shadow:var(--shadow); overflow:hidden; }
  .card-head { display:flex; align-items:center; gap:12px; min-height:62px; padding:14px 20px; }
  .card-head h2 { margin:0; font-size:14px; font-weight:600; letter-spacing:-.15px; }
  .card-head .head-text { flex:1; min-width:0; }
  .hint { color:var(--text-muted); font-size:12px; }
  .card-head .hint { margin-left:auto; }
  .svc-select,.range-select { appearance:none; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); color:var(--text-secondary); height:32px; padding:0 29px 0 10px; cursor:pointer; min-width:0; max-width:240px; font-size:12px; text-overflow:ellipsis;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a939e' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center;
  }
  .svc-select:hover,.range-select:hover { border-color:var(--baseline); color:var(--text-primary); }
  .range-select { width:72px; flex:none; }
  .flow-card { --map-height:480px; margin-bottom:28px; }
  .flow-card>.card-head { justify-content:space-between; }
  .flow-status { min-width:0; display:flex; align-items:center; justify-content:flex-end; gap:16px; height:24px; overflow:hidden; white-space:nowrap; color:var(--text-muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .flow-status strong { color:var(--text-primary); font-weight:600; margin-right:4px; }
  .state-pill { display:inline-flex; align-items:center; gap:6px; border-radius:5px; padding:3px 7px; font-size:10px; font-weight:550; white-space:nowrap; color:var(--text-secondary); background:var(--surface-1); }
  .state-pill::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--status-neutral); }
  .state-pill.good::before,.state-pill.ready::before { background:var(--status-good); }
  .state-pill.warning::before,.state-pill.partial::before { background:var(--status-warning); }
  .state-pill.critical::before,.state-pill.disconnected::before { background:var(--status-critical); }
  .flow-controls { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:58px; padding:11px 20px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .flow-options,.view-tools,.control-group { display:flex; align-items:center; gap:8px; }
  .flow-options { flex-wrap:wrap; }
  .flow-options select { width:136px; }
  .flow-options #flow-protocol { width:120px; }
  .view-tools { flex:none; gap:6px; }
  .control-group { gap:1px; padding:2px; border:1px solid var(--border); border-radius:7px; }
  .flow-controls button { display:grid; place-items:center; padding:0; width:28px; height:26px; border:0; border-radius:4px; background:transparent; color:var(--text-secondary); cursor:pointer; }
  .flow-controls button:hover:not(:disabled) { background:var(--surface-1); color:var(--text-primary); }
  .flow-controls button:disabled { opacity:.25; cursor:default; }
  .flow-controls button[data-flow-clear] { height:32px; width:32px; }
  .flow-workspace { display:grid; grid-template-columns:minmax(0,1fr) 304px; height:var(--map-height); }
  .flow-viewport { min-width:0; height:100%; overflow:hidden; background:var(--flow-bg); background-image:radial-gradient(var(--flow-grid) .65px,transparent .65px); background-size:22px 22px; }
  .flow-svg { display:block; width:100%; height:100%; }
  .flow-empty { display:grid; place-items:center; height:100%; color:var(--text-muted); font-size:12px; }
  .flow-inspector { min-width:0; height:100%; padding:20px; border-left:1px solid var(--border); overflow:auto; scrollbar-width:thin; overflow-wrap:anywhere; }
  .inspector-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:20px; }
  .flow-inspector h3 { margin:0; font-size:14px; font-weight:600; letter-spacing:-.2px; }
  .flow-inspector h4 { margin:22px 0 10px; font-size:12px; font-weight:600; color:var(--text-secondary); }
  .flow-inspector p { margin:8px 0; color:var(--text-muted); font-size:12px; }
  .flow-inspector dl { display:grid; grid-template-columns:1fr minmax(0,1.25fr); gap:11px 12px; margin:16px 0; font-size:12px; }
  .flow-inspector dt { color:var(--text-muted); }
  .flow-inspector dd { margin:0; text-align:right; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .cluster-stats { display:grid; grid-template-columns:1fr 1fr; gap:22px 12px; margin:22px 0 28px; }
  .cluster-stat strong { display:block; font-size:26px; font-weight:550; line-height:1.2; letter-spacing:-.8px; font-variant-numeric:tabular-nums; }
  .cluster-stat span { display:block; margin-top:5px; color:var(--text-muted); font-size:11px; }
  .flow-inspector .flow-pick { display:flex; align-items:center; gap:10px; width:100%; text-align:left; margin:0; border:0; border-bottom:1px solid var(--border); padding:11px 0; background:transparent; color:var(--text-primary); font-size:12px; cursor:pointer; }
  .flow-pick:hover { color:var(--series-1); }
  .pick-main { flex:1; min-width:0; }
  .pick-main strong { font-weight:500; }
  .pick-main small { display:block; margin-top:3px; color:var(--text-muted); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pick-meta { color:var(--text-muted); font-size:10px; font-variant-numeric:tabular-nums; }
  .route-dot { width:6px; height:6px; border-radius:50%; background:var(--route-color); flex:none; }
  .flow-inspector .flow-path { display:flex; flex-direction:column; gap:0; padding:12px 0; margin:0 0 16px; color:var(--text-secondary); font-size:11px; }
  .path-stop { padding:7px 0 7px 17px; position:relative; border-left:1px solid var(--border); margin-left:3px; }
  .path-stop::before { content:""; position:absolute; width:5px; height:5px; left:-3px; top:13px; border:1px solid var(--flow-ring); background:var(--surface-2); border-radius:50%; }
  .path-stop:first-child,.path-stop:last-child { color:var(--text-primary); }
  .flow-inspector details { border-top:1px solid var(--border); margin-top:16px; }
  .flow-inspector summary { cursor:pointer; font-size:12px; color:var(--text-secondary); padding:12px 0; }
  .flow-inspector summary { display:flex; align-items:center; gap:8px; list-style:none; }
  .flow-inspector summary::-webkit-details-marker { display:none; }
  .flow-inspector summary::before { content:"›"; color:var(--text-muted); font-size:15px; line-height:1; }
  .flow-inspector details[open]>summary::before { transform:rotate(90deg); }
  .link-detail summary>span:first-of-type { flex:1; }
  .link-rtt { color:var(--text-muted); font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .flow-inspector { scrollbar-gutter:stable; }
  .flow-inspector .business-id { font:10px/1.7 ui-monospace,SFMono-Regular,monospace; color:var(--text-secondary); }
  .flow-legend { display:flex; align-items:center; gap:18px; height:52px; padding:0 20px; border-top:1px solid var(--border); overflow-x:auto; scrollbar-width:thin; white-space:nowrap; }
  .flow-legend:empty::after { content:"No active routes"; color:var(--text-muted); font-size:11px; }
  .flow-legend-item { display:inline-flex; align-items:center; gap:7px; flex:none; color:var(--text-secondary); background:transparent; border:0; padding:5px 0; font-size:11px; cursor:pointer; }
  .flow-legend-item::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--route-color); }
  .flow-legend-item[aria-pressed="true"] { color:var(--text-primary); box-shadow:0 2px var(--route-color); }
  .flow-legend-item .route-protocol { color:var(--text-muted); font-size:10px; }
  .flow-legend-item .route-count { color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .flow-track,.flow-band { fill:none; stroke-linejoin:round; stroke-linecap:butt; }
  .flow-shared-track,.flow-station { cursor:pointer; outline:none; }
  .flow-hit { fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; }
  .flow-shared-track:focus-visible .flow-track,.flow-station:focus-visible .flow-node,.flow-station:focus-visible .flow-agent { stroke:var(--flow-ink); stroke-width:3; }
  .flow-shared-track.selected .flow-track { stroke:var(--flow-ink); }
  .flow-station.selected .flow-label { text-decoration:underline; }
  .flow-route-focus { display:none; pointer-events:none; }
  .flow-route-focus.selected { display:initial; }
  .flow-focus-path { fill:none; stroke-width:4; }
  .flow-dimmed { opacity:.16; }
  .flow-node,.flow-agent { fill:var(--flow-node-bg); stroke:var(--flow-ring); }
  .flow-node { stroke:none; }
  .flow-agent { stroke:var(--flow-muted); }
  .flow-station text { fill:var(--flow-ink); font-size:12px; paint-order:stroke; stroke:var(--flow-bg); stroke-width:4; stroke-linejoin:round; }
  .flow-node-station { --station-color:var(--flow-ring); }
  .flow-node-station.good { --station-color:var(--flow-good); }
  .flow-node-station.warning { --station-color:var(--flow-warning); }
  .flow-node-station.critical { --station-color:var(--flow-critical); }
  .flow-capacity-track { fill:none; stroke:var(--station-color); stroke-linecap:butt; opacity:.2; }
  .flow-node-station .flow-capacity { fill:none; stroke:var(--station-color); stroke-linecap:butt; }
  .flow-node-station .flow-label { font-weight:600; font-size:11.5px; }
  .flow-agent-station .flow-label { fill:var(--text-secondary); font-size:10.5px; }
  .flow-station .flow-agent-role { fill:var(--flow-muted); font-size:9px; }
  .flow-station .flow-headroom { fill:var(--flow-ink); font-weight:600; font-size:10px; font-variant-numeric:tabular-nums; stroke:none; }
  .flow-alert circle { fill:var(--flow-node-bg); stroke:var(--station-color); stroke-width:1.5; }
  .flow-alert text { fill:var(--flow-ink); stroke:none; font-size:10px; font-weight:700; }
  .flow-node-station.unknown .flow-capacity-track { stroke-dasharray:3 3; opacity:.6; }
  .flow-svg,.flow-legend { user-select:none; -webkit-user-select:none; }
  .chart-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-bottom:20px; }
  .chart-card { height:342px; display:grid; grid-template-rows:62px 36px minmax(0,1fr); }
  .chart-toolbar { display:flex; align-items:center; gap:12px; min-width:0; padding:0 20px 8px; }
  .chart-toolbar .svc-select { flex:0 1 220px; width:220px; max-width:calc(100% - 104px); height:28px; font-size:11px; }
  .chart-toolbar .legend { margin-left:auto; }
  .legend { display:flex; align-items:center; gap:16px; white-space:nowrap; }
  .legend .item { display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary); font-size:11px; }
  .legend .key { width:12px; height:2px; border-radius:1px; }
  .chart-plot { min-width:0; min-height:0; position:relative; padding:0 12px 12px; }
  svg.chart { display:block; width:100%; height:100%; overflow:visible; touch-action:none; user-select:none; }
  svg.chart .gridline { stroke:var(--gridline); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .axis { stroke:var(--border); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .tick { fill:var(--text-muted); font-size:10px; font-variant-numeric:tabular-nums; }
  svg.chart .series { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  svg.chart .marker { stroke:var(--surface-2); stroke-width:2; }
  svg.chart .crosshair { stroke:var(--text-muted); stroke-width:1; stroke-dasharray:3 3; opacity:0; }
  svg.chart .hover-hit { fill:transparent; cursor:crosshair; }
  svg.chart .zoom-selection { fill:var(--series-1); opacity:.15; pointer-events:none; }
  .tooltip { position:absolute; pointer-events:none; z-index:10; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; min-width:150px; box-shadow:var(--shadow); display:none; font-size:11px; }
  .tooltip .t-head { color:var(--text-muted); margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .tooltip .row { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .tooltip .row .name { display:inline-flex; align-items:center; gap:7px; color:var(--text-secondary); }
  .tooltip .row .key { width:10px; height:2px; }
  .tooltip .row .val { font-weight:550; font-variant-numeric:tabular-nums; }
  .table-wrap { overflow:visible; }
  table.svc { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  table.svc th,table.svc td { text-align:left; padding:13px 16px; border-bottom:1px solid var(--border); }
  table.svc th { background:var(--surface-1); color:var(--text-muted); font-size:10px; font-weight:500; white-space:nowrap; }
  table.svc td { font-size:12px; vertical-align:top; }
  table.svc td.num,table.svc th.num { text-align:right; }
  table.svc tr:last-child td { border:0; }
  table.traffic-table { table-layout:fixed; }
  table.traffic-table td { overflow-wrap:anywhere; }
  .col-index { width:4%; } .col-node { width:12%; } .col-service { width:24%; } .col-protocol { width:8%; } .col-rate,.col-total { width:13%; }
  .proto-pill { display:inline-block; padding:2px 6px; border:1px solid var(--border); border-radius:4px; color:var(--text-secondary); font-size:10px; text-transform:uppercase; }
  .rate-cell { display:inline-grid; grid-template-columns:5px minmax(0,1fr); align-items:center; gap:7px; max-width:100%; }
  .rate-cell .key { width:5px; height:5px; border-radius:50%; }
  .rate-cell .metric-value,.traffic-table .total-value { display:inline-block; max-width:100%; text-align:right; font-variant-numeric:tabular-nums; }
  .rate-cell.rx .key { background:var(--series-5); } .rate-cell.tx .key { background:var(--series-6); }
  .cum-cell { color:var(--text-secondary); }
  .service-tree { min-width:0; }
  .service-tree-root { display:flex; align-items:center; gap:7px; min-height:22px; font-weight:550; }
  .service-tree-root::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--series-1); flex:none; }
  .access-count,.connection-count { color:var(--text-muted); font-size:10px; font-weight:400; white-space:nowrap; }
  .connection-count { margin-left:5px; }
  .service-tree-children { list-style:none; margin:4px 0 0 2px; padding:0 0 0 15px; border-left:1px solid var(--border); }
  .service-tree-children li { position:relative; min-height:22px; padding:2px 0 2px 7px; color:var(--text-secondary); font-size:11px; }
  .service-tree-children li::before { content:""; position:absolute; left:-15px; top:11px; width:12px; border-top:1px solid var(--border); }
  .service-tree-children .no-accessor { color:var(--text-muted); }
  .accessor-location { margin-right:5px; white-space:nowrap; cursor:help; }
  .empty { color:var(--text-muted); padding:24px 20px; font-size:12px; }
  .service-pagination { display:flex; align-items:center; gap:12px; min-height:58px; padding:12px 20px; border-top:1px solid var(--border); color:var(--text-muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .service-pagination[hidden] { display:none; }
  #service-page-range { margin-right:auto; }
  .service-pagination button { display:grid; place-items:center; width:28px; height:28px; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); cursor:pointer; }
  .service-pagination button:hover:not(:disabled) { background:var(--surface-1); color:var(--text-primary); }
  .service-pagination button:disabled { opacity:.3; cursor:default; }
  .error-banner { margin-bottom:20px; padding:12px 16px; border:1px solid var(--status-critical); border-radius:8px; color:var(--text-secondary); font-size:12px; }
  .stale { opacity:.55; transition:opacity .2s; }
  @media (max-width:1100px) {
    main { padding:24px; } .topbar-inner { padding:0 24px; }
    .flow-workspace { grid-template-columns:minmax(0,1fr) 272px; }
    .flow-controls { padding:11px 16px; gap:8px; } .flow-options { gap:6px; }
    .flow-options select { width:116px; } .flow-options #flow-protocol { width:110px; }
    table.svc th,table.svc td { padding:12px 10px; }
  }
  @media (max-width:900px) {
    .flow-controls { flex-wrap:wrap; } .flow-options { flex:1; } .view-tools { margin-left:auto; }
    .flow-workspace { grid-template-columns:minmax(0,1fr) 248px; }
    .flow-inspector { padding:16px; } .flow-status { gap:10px; }
    .chart-row { grid-template-columns:1fr; }
    .traffic-table colgroup,.traffic-table thead { display:none; }
    .traffic-table,.traffic-table tbody { display:block; }
    .traffic-table tbody tr { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 20px; padding:16px 20px; border-top:1px solid var(--border); }
    .traffic-table tbody td { display:block; padding:0; border:0; text-align:left; min-width:0; }
    .traffic-table tbody td::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--text-muted); font-size:10px; }
    .traffic-table tbody td:nth-child(3),.traffic-table tbody td.empty { grid-column:1/-1; }
    .traffic-table tbody td.empty::before { display:none; }
  }
  @media (max-width:680px) {

<script>

function fmtBps(bps){ if(bps===undefined||bps===null||bps<=0) return "0 b/s"; const bits=bps*8;

  if(d) return d+"d "+h+"h";

}
function fmtAge(s){

  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
  if(d) return d+"d "+h+"h ago";
  if(h) return h+"h "+m+"m ago";
  if(m) return m+"m ago";

function serviceTree(t){

function _pad2(n){ return n < 10 ? "0"+n : ""+n; }
function fmtAxisDate(timestamp){ const d=new Date(timestamp*1000); return _pad2(d.getMonth()+1)+"-"+_pad2(d.getDate()); }

function fmtChartTime(timestamp){ const d=new Date(timestamp*1000);
  return _pad2(d.getMonth()+1)+"-"+_pad2(d.getDate())+" "+_pad2(d.getHours())+":"+_pad2(d.getMinutes())+":"+_pad2(d.getSeconds()); }

// Presets and mouse selections share one continuous time axis.
const MAX_HISTORY_SECONDS = 7 * 24 * 60 * 60;
const RANGE_PRESETS = [
  {label:"1m", secs:60},
  {label:"1h", secs:3600},
  {label:"1d", secs:86400},
  {label:"7d", secs:MAX_HISTORY_SECONDS},

const chartRanges = {"chart-queue":60, "chart-bandwidth":60};
const chartViews = {"chart-queue":null, "chart-bandwidth":null};
let chartDragging = null;
function chartDomain(cid, now){
  return chartViews[cid] || {start:now-chartRanges[cid], end:now};
}
function setChartView(cid, start, end){
  const now = Number(currentData?.now) || Date.now()/1000;
  start = Math.max(now-MAX_HISTORY_SECONDS, start);
  end = Math.min(now, end);
  if(end-start < 1) return;

}
// Bandwidth chart selection is independent from the node overview selection.
// The compound key keeps same-named services on different nodes distinct.
let bandwidthSelection = null;
let selectedNodeKey = null;
let servicePage = 0;
let flowSvgText = null;
let flowView = null;
let flowSelection = null;
let flowNotice = "";
function resetFlowView(reserveAgents=false){
  const scene = $("flow-viewport").querySelector(".flow-scene").getBBox();
  const content = reserveAgents
    ? {x:scene.x - 200, y:scene.y - 96, width:scene.width + 400, height:scene.height + 256}
    : {x:scene.x - 28, y:scene.y - 28, width:scene.width + 56, height:scene.height + 56};
  flowView = {content, bounds:null, zoom:1};
}
function applyFlowView(){
  const viewport = $("flow-viewport"), svg = viewport.querySelector("svg");
  if(svg && flowView && viewport.clientWidth && viewport.clientHeight){
    const {content} = flowView;
    const displayHeight = viewport.clientHeight;
    const scale = Math.min(1.25, viewport.clientWidth / content.width, displayHeight / content.height);
    const fittedWidth = viewport.clientWidth / scale, fittedHeight = displayHeight / scale;
    const nextBounds = {x:content.x + (content.width - fittedWidth) / 2,
      y:content.y + (content.height - fittedHeight) / 2, width:fittedWidth, height:fittedHeight};
    const previous = flowView.bounds;
    if(previous){
      flowView.x += (previous.width - nextBounds.width) / flowView.zoom / 2;
      flowView.y += (previous.height - nextBounds.height) / flowView.zoom / 2;
    }else{

    const {bounds, zoom} = flowView;
    const width = bounds.width / zoom, height = bounds.height / zoom;
    flowView.x = Math.max(bounds.x, Math.min(flowView.x, bounds.x + bounds.width - width));
    flowView.y = Math.max(bounds.y, Math.min(flowView.y, bounds.y + bounds.height - height));
    svg.setAttribute("viewBox", `${flowView.x} ${flowView.y} ${width} ${height}`);
    svg.setAttribute("width", bounds.width);
    svg.setAttribute("height", bounds.height);
  }

    const action = button.dataset.flowView;
    button.disabled = !flowView || (action === "in" ? flowView.zoom >= 4

  });
}

$("flow-controls").addEventListener("click", event => {
  const button = event.target.closest("button[data-flow-view]");
  if(!button || button.disabled || !flowView) return;
  const {bounds, zoom} = flowView;
  const action = button.dataset.flowView;
  if(action === "fit"){
    resetFlowView();
  }else if(action === "in" || action === "out"){
    const nextZoom = Math.max(1, Math.min(4, zoom * (action === "in" ? 1.25 : .8)));
    flowView.x += bounds.width / zoom / 2 - bounds.width / nextZoom / 2;
    flowView.y += bounds.height / zoom / 2 - bounds.height / nextZoom / 2;
    flowView.zoom = nextZoom;

    if(action === "left") flowView.x -= bounds.width / zoom * .15;
    if(action === "right") flowView.x += bounds.width / zoom * .15;
    if(action === "up") flowView.y -= bounds.height / zoom * .15;
    if(action === "down") flowView.y += bounds.height / zoom * .15;

});
function statePill(state, label){

  const key = Object.hasOwn(names, state) ? state : "unknown";
  const title = key === "stale" ? ' title="Last known measurements"' : "";
  return `<span class="state-pill ${key}"${title}>${escapeText(label || names[key])}</span>`;
}
function inspectorHeading(title, state){

}
function renderFlowMap(map){

  const filtered = $("flow-service").value || $("flow-protocol").value;
  const count = filtered ? map.visible_flow_count : map.flow_count;
  const routes = filtered ? map.visible_route_count : map.route_count;

  status.innerHTML = (collected ? `<span><strong>${map.partial ? "≥" : ""}${count}</strong>flows</span><span><strong>${routes}</strong>routes</span><span><strong>${map.nodes.length}</strong>nodes</span>` : "")

    map.unmatched_count ? `${map.unmatched_count} unmatched businesses` : "",

    item.title=`${route.count} connections · ${route.consumer.peer} → ${route.path.join(" → ")} → ${route.producer.peer}`;
    return item;

}
function flowSelectedObject(map){

    : type === "agent" ? [map.agents, "id"] : type === "link" ? [map.links, "id"] : [map.shared_tracks, "id"];

function flowLinkDetails(link, open=false){

function cs(key){ return getComputedStyle(document.body).getPropertyValue(key).trim(); }

function makeScale(domainMin, domainMax, rangeMin, rangeMax){
  const span = Math.max(1e-9, domainMax - domainMin);
  return (v) => rangeMin + ((v - domainMin) / span) * (rangeMax - rangeMin);
}

// Detect missing sample runs without changing their width on the time axis.
function historyGaps(history){
  const steps = history.slice(1).map((point,i)=>point.t-history[i].t).filter(step=>step>0).sort((a,b)=>a-b);
  const threshold = Math.max(15, (steps[Math.floor(steps.length/2)] || 2)*8);
  return history.slice(1).flatMap((point,i)=>point.t-history[i].t>threshold ? [{i}] : []);
}

function linePath(pts){
  if(!pts.length) return "";
  let d = "M" + pts[0].x.toFixed(2) + " " + pts[0].y.toFixed(2);
  for(let i=1;i<pts.length;i++) d += " L" + pts[i].x.toFixed(2) + " " + pts[i].y.toFixed(2);
  return d;
}
// Leave disconnect intervals blank instead of inventing values between runs.
function linePathGapped(pts, gaps){
  const gapIdx = new Set((gaps||[]).map(g => g.i));
  let d = "", connected = false;
  pts.forEach((point,i)=>{
    if(!point){ connected=false; return; }
    d += (connected && !gapIdx.has(i-1) ? " L" : " M") + point.x.toFixed(2) + " " + point.y.toFixed(2);
    connected=true;
  });
  return d.trim();
}
function niceTicks(min, max, count){
  if(min===max){ min=min-1; max=max+1; }
  const span = max - min;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  let step;
  if(norm < 1.5) step = 1; else if(norm < 3) step = 2; else if(norm < 7) step = 5; else step = 10;
  step *= mag;
  const start = Math.floor(min/step)*step;
  const ticks = [];
  for(let v=start; v<=max+1e-9; v+=step) if(v>=min-1e-9) ticks.push(v);
  return ticks;
}

// Round a magnitude up to a clean "nice" ceiling (1, 1.5, 2, 3, 5, 10 × 10^n).
// Keeps the y-axis top stable and grid-aligned instead of jittering every sample.
// When the data peak lands exactly on a nice value (e.g. 100000 B/s shows as
// 800.00 Kb/s, and niceCeil(100000) == 100000), the top tick equals the peak and
// the line/end-marker sit on the top gridline with no headroom — visually
// "over the boundary". Step up one nice level in that case so the axis always
// clears the data.
function niceCeil(v){
  if(v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  let step;
  if(norm <= 1) step = 1; else if(norm <= 1.5) step = 1.5; else if(norm <= 2) step = 2;
  else if(norm <= 3) step = 3; else if(norm <= 5) step = 5; else step = 10;
  let ceil = step * mag;
  if(ceil <= v){
    if(step === 1) ceil = 1.5 * mag;
    else if(step === 1.5) ceil = 2 * mag;
    else if(step === 2) ceil = 3 * mag;
    else if(step === 3) ceil = 5 * mag;
    else if(step === 5) ceil = 10 * mag;
    else ceil = 1.5 * mag * 10;
  }
  return ceil;
}

// Draw a full chart with axes + crosshair tooltip. series: [{name,colorVar,key(xData)}]
function drawChart(svg, tipEl, history, series, fmtY, timeDomain=null){
  const W = svg.clientWidth || 600, H = svg.clientHeight || 240;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const m = {l:48, r:14, t:10, b:38};  // b: two-line x-axis (date + time)
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  // Latency/queue-delay metrics start at 0. Pin the baseline to 0 so the line
  // doesn't get visually "lifted" when the window's minimum drifts upward; a
  // floating baseline exaggerates noise and makes the whole graph jump. The top
  // is a clean ceiling over the data max, so the axis stays stable across polls.
  let dataMax = 0;
  for(const s of series) for(const p of history){ const v = p[s.key]; if(v!==UNSET && v!=null){ dataMax=Math.max(dataMax,v); } }
  if(dataMax <= 0){ dataMax = 1; }
  const yMin = 0;
  const yMax = niceCeil(dataMax);
  const domain = timeDomain || {start:history[0]?.t || 0, end:history.at(-1)?.t || 1};
  const sx = makeScale(domain.start, domain.end, m.l, m.l+pw);
  const invert = makeScale(m.l, m.l+pw, domain.start, domain.end);
  const gaps = historyGaps(history);
  const sy = makeScale(yMin, yMax, m.t+ph, m.t);
  const yticks = niceTicks(yMin, yMax, 4);
  let parts = "";
  for(const tv of yticks){
    const y = sy(tv);
    parts += `<line class="gridline" x1="${m.l}" x2="${m.l+pw}" y1="${y.toFixed(2)}" y2="${y.toFixed(2)}"/>`;
    parts += `<text class="tick" x="${m.l-8}" y="${(y+3).toFixed(2)}" text-anchor="end">${fmtY(tv)}</text>`;
  }
  const xtickCount = Math.min(6, Math.max(2, Math.floor(pw/80)));
  const xticks = [];
  for(let i=0; i<=xtickCount; i++){
    xticks.push(invert(m.l + pw*i/xtickCount));
  }
  let prevDate = null;
  for(const timestamp of xticks){
    const x = sx(timestamp);
    parts += `<line class="gridline" x1="${x.toFixed(2)}" x2="${x.toFixed(2)}" y1="${m.t}" y2="${m.t+ph}"/>`;
    const dateStr = fmtAxisDate(timestamp);
    const timeStr = fmtAxisTime(timestamp);
    const showDate = dateStr !== prevDate;
    prevDate = dateStr;
    parts += `<text class="tick" x="${x.toFixed(2)}" y="${(m.t+ph+15).toFixed(2)}" text-anchor="middle">${showDate ? escapeText(dateStr) : ""}<tspan x="${x.toFixed(2)}" dy="13">${escapeText(timeStr)}</tspan></text>`;
  }
  parts += `<line class="axis" x1="${m.l}" x2="${m.l+pw}" y1="${(m.t+ph).toFixed(2)}" y2="${(m.t+ph).toFixed(2)}"/>`;
  parts += `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${(m.t+ph).toFixed(2)}"/>`;
  if(!history.length) parts += `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="tick">waiting for data…</text>`;
  const seriesPts = [];
  for(const s of series){
    const pts = history.map(p => { const v = p[s.key]; if(v===UNSET||v==null) return null; return {x:sx(p.t), y:sy(v)}; });
    seriesPts.push({s, pts:pts.filter(Boolean)});
    const color = cs(s.colorVar);
    parts += `<path class="series" stroke="${color}" d="${linePathGapped(pts, gaps)}"/>`;
  }
  for(const sp of seriesPts){
    if(!sp.pts.length) continue;
    const last = sp.pts[sp.pts.length-1];
    const color = cs(sp.s.colorVar);
    parts += `<circle class="marker" cx="${last.x.toFixed(2)}" cy="${last.y.toFixed(2)}" r="4" fill="${color}"/>`;
  }
  parts += `<line class="crosshair" id="ch-x" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}"/>`;
  parts += `<rect class="hover-hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/>`;

  parts += `<rect class="zoom-selection" x="0" y="${m.t}" width="0" height="${ph}"/>`;
  svg.innerHTML = parts;
  tipEl.style.display = "none";
  const chx = svg.querySelector("#ch-x");
  const hit = svg.querySelector(".hover-hit");

  function move(ev){
    if(!history.length) return;
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * W;
    let best = 0, bd = Infinity;
    for(let i=0;i<history.length;i++){ const d = Math.abs(sx(history[i].t) - px); if(d<bd){bd=d;best=i;} }
    const x = sx(history[best].t);
    chx.setAttribute("x1", x); chx.setAttribute("x2", x); chx.style.opacity = 0.9;
    const rows = series.map(sp => {
      const p = history[best];
      const v = p[sp.key];
      const valTxt = (v===UNSET||v==null) ? "no data" : fmtY(v);
      return `<div class="row"><span class="name"><span class="key" style="background:${cs(sp.colorVar)}"></span>${escapeText(sp.name)}</span><span class="val">${escapeText(valTxt)}</span></div>`;
    }).join("");
    const head = fmtChartTime(history[best].t);
    tipEl.innerHTML = `<div class="t-head">${escapeText(head)}</div>${rows}`;
    tipEl.style.display = "block";
    const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    let tx = ev.clientX - rect.left + 12, ty = ev.clientY - rect.top - th - 8;
    if(tx + tw > rect.width) tx = ev.clientX - rect.left - tw - 12;
    if(ty < 0) ty = ev.clientY - rect.top + 12;
    tipEl.style.left = tx + "px"; tipEl.style.top = ty + "px";
  }
  function leave(){ chx.style.opacity = 0; tipEl.style.display = "none"; }
  const selection = svg.querySelector(".zoom-selection");
  function plotX(event){
    const rect = svg.getBoundingClientRect();
    return Math.max(m.l, Math.min(m.l+pw, (event.clientX-rect.left)/rect.width*W));
  }
  svg.onpointerdown = event=>{
    if(event.button !== 0 || !event.target.closest(".hover-hit")) return;
    chartDragging = {cid:svg.id, start:plotX(event), end:plotX(event), domain, invert};
    svg.setPointerCapture(event.pointerId);
    leave();
  };
  svg.onpointermove = event=>{
    if(chartDragging?.cid !== svg.id){ if(event.target === hit) move(event); return; }
    chartDragging.end = plotX(event);
    selection.setAttribute("x", Math.min(chartDragging.start, chartDragging.end));
    selection.setAttribute("width", Math.abs(chartDragging.end-chartDragging.start));
  };
  svg.onpointerup = event=>{
    if(chartDragging?.cid !== svg.id) return;
    const drag = chartDragging;
    drag.end = plotX(event);
    chartDragging = null;
    selection.setAttribute("width", 0);
    if(svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    if(Math.abs(drag.end-drag.start) >= 5){
      setChartView(svg.id, drag.invert(Math.min(drag.start,drag.end)), drag.invert(Math.max(drag.start,drag.end)));
    }
  };
  svg.onpointercancel = ()=>{ chartDragging = null; selection.setAttribute("width",0); };
  svg.onpointerleave = leave;
  svg.ondblclick = ()=>{ chartViews[svg.id] = null; resetHistoryAndPoll(); };
  svg.onwheel = event=>{
    event.preventDefault();
    if(chartDragging || pollInFlight) return;
    const anchor = invert(plotX(event));
    const factor = event.deltaY < 0 ? .75 : 1/.75;
    const span = Math.min(MAX_HISTORY_SECONDS, Math.max(1, (domain.end-domain.start)*factor));
    const fraction = (anchor-domain.start)/(domain.end-domain.start);
    const now = Number(currentData?.now) || Date.now()/1000;
    const end = Math.min(now, Math.max(now-MAX_HISTORY_SECONDS+span, anchor+(1-fraction)*span));
    setChartView(svg.id, end-span, end);
  };

}

let currentData = null;
let historyCursor = null;
let pollInFlight = false;
let pollPending = false;
let pollTimer = null;
let pollGeneration = 0;

function compactHistory(points){
  if(points.length <= HISTORY_HIGH_WATER) return points;
  const compacted = [];
  const last = points.length - 1;
  for(let i=0; i<HISTORY_COMPACT_TO; i++){
    compacted.push(points[Math.round(i * last / (HISTORY_COMPACT_TO - 1))]);
  }
  return compacted;
}

function mergeHistory(previous, updates, rangeSeconds, now){
  let merged;
  if(!previous || !previous.length){
    merged = (updates || []).slice();
  } else if(!updates || !updates.length){
    merged = previous.slice();
  } else if(updates[0].t > previous[previous.length-1].t){
    merged = previous.concat(updates);
  } else {
    const byTimestamp = new Map(previous.map(point => [point.t, point]));
    updates.forEach(point => byTimestamp.set(point.t, point));
    merged = Array.from(byTimestamp.values()).sort((a,b) => a.t-b.t);
  }
  if(rangeSeconds != null){
    const cutoff = now - rangeSeconds;
    merged = merged.filter(point => point.t >= cutoff && point.t <= now);
  }
  return compactHistory(merged);
}

function mergeSnapshot(previous, update){
  if(!previous || update.history_mode !== "delta") return update;
  const previousNodes = new Map((previous.nodes || []).map(node => [node.key, node]));
  const now = Number(update.now) || Date.now()/1000;
  update.nodes = (update.nodes || []).map(node => {
    const old = previousNodes.get(node.key);
    if(!old) return node;
    node.history = mergeHistory(
      old.history, node.history, MAX_HISTORY_SECONDS, now
    );
    const oldTraffic = old.traffic_history || {};
    const newTraffic = node.traffic_history || {};
    const currentServices = new Set((node.service_traffic || []).map(service => service.service));
    const names = new Set([...Object.keys(oldTraffic), ...Object.keys(newTraffic)]);
    node.traffic_history = {};
    names.forEach(name => {
      const history = mergeHistory(
        oldTraffic[name], newTraffic[name], MAX_HISTORY_SECONDS, now
      );
      if(history.length || currentServices.has(name)) node.traffic_history[name] = history;
    });
    return node;
  });
  return update;
}

function resetHistoryAndPoll(){
  historyCursor = null;
  currentData = null;
  pollGeneration++;
  pollPending = true;
  if(pollTimer !== null){ clearTimeout(pollTimer); pollTimer = null; }
  poll();
}

function renderServices(nodes, totalNodes){
  const services = nodes.flatMap(node => (node.service_traffic || []).map(service => ({node:nodeName(node), ...service})))
    .sort((a,b) => a.node.localeCompare(b.node) || a.service.localeCompare(b.service) || a.protocol.localeCompare(b.protocol));
  const pages = Math.max(1, Math.ceil(services.length / SERVICE_PAGE_SIZE));
  servicePage = Math.max(0, Math.min(servicePage, pages-1));
  const start = servicePage * SERVICE_PAGE_SIZE;
  const visible = services.slice(start, start + SERVICE_PAGE_SIZE);
  $("svc-hint").textContent = services.length + " total";
  $("svc-hint").title = "Across " + totalNodes + " Nodes";
  $("svc-body").innerHTML = visible.length ? visible.map((service,index) => `<tr>
    <td data-label="#">${start+index+1}</td>
    <td data-label="Node">${escapeText(service.node)}</td>
    <td data-label="Service / accessors">${serviceTree(service)}</td>
    <td data-label="Protocol"><span class="proto-pill">${escapeText(service.protocol)}</span></td>
    <td data-label="RX rate" class="num"><span class="rate-cell rx"><span class="key"></span><span class="metric-value">${fmtBps(service.rx_bytes_per_second)}</span></span></td>
    <td data-label="TX rate" class="num"><span class="rate-cell tx"><span class="key"></span><span class="metric-value">${fmtBps(service.tx_bytes_per_second)}</span></span></td>
    <td data-label="RX total" class="num cum-cell"><span class="total-value">${fmtBytes(service.rx_bytes)}</span></td>
    <td data-label="TX total" class="num cum-cell"><span class="total-value">${fmtBytes(service.tx_bytes)}</span></td>
  </tr>`).join("") : '<tr><td colspan="8" class="empty">No services</td></tr>';
  $("service-pagination").hidden = pages <= 1;
  $("service-page-range").textContent = services.length ? `${start+1}–${start+visible.length} of ${services.length}` : "0";
  $("service-page-number").textContent = `${servicePage+1} / ${pages}`;
  $("service-page-prev").disabled = servicePage === 0;
  $("service-page-next").disabled = servicePage === pages-1;
}
for(const [id,delta] of [["service-page-prev",-1],["service-page-next",1]]){
  $(id).addEventListener("click", () => {
    if(!currentData || $(id).disabled) return;
    servicePage += delta;
    renderServices(currentData.nodes || [], currentData.total_nodes || currentData.nodes?.length || 0);
  });
}

function render(data){
  currentData = data;
  if(chartDragging) return;
  renderFlowMap(data.flow_map);
  const nodes = data.nodes || [];
  const renderNow = Number(data.now) || Date.now()/1000;
  populateNodeSelect(nodes);
  const badge = $("conn-badge");
  const connectedNodes = Number(data.connected_nodes || 0);
  const totalNodes = Number(data.total_nodes || nodes.length);
  const entryConnected = Boolean(data.entry_connected);
  const state = !entryConnected
    ? (data.entry_connecting ? "connecting" : "disconnected")
    : (totalNodes > 0 && connectedNodes === totalNodes ? "connected" : "connecting");
  badge.setAttribute("data-state", state);
  $("conn-label").textContent = connectedNodes + "/" + totalNodes + " online";

  const eb = $("error-banner");
  const unavailable = nodes.filter(item => !item.connected);
  const errors = [];
  if(data.entry_error) errors.push("Entry: " + data.entry_error);
  if(unavailable.length) errors.push("Unavailable nodes: " + unavailable.map(item =>
      nodeName(item) + " (" + (item.last_error || nodeState(item)) + ")"
    ).join("; "));
  if(errors.length){
    eb.textContent = errors.join(" · ");
    eb.style.display = "block";
  } else {
    eb.style.display = "none";
  }

  const node = nodes.find(item => item.key === selectedNodeKey) || nodes[0];
  $("peer").textContent = data.entry_node_id ? "Entry: " + data.entry_node_id : (data.entry_peer || "—");
  const hist = node ? node.history || [] : [];

  const queueDomain = chartDomain("chart-queue", renderNow);
  const queueHist = windowHistory(hist, queueDomain);
  drawChart($("chart-queue"), $("tip-queue"), queueHist,
    [{name:"Control queue", colorVar:"--series-1", key:"cqd"},
     {name:"TCP transfer queue", colorVar:"--series-2", key:"tcp_qd"},
     {name:"UDP transfer queue", colorVar:"--series-4", key:"udp_qd"}],
    fmtUs, queueDomain);

  renderServices(nodes, totalNodes);

  // Bandwidth can follow any discovered node/service, independently of the
  // node selected for the queue chart.
  const bandwidthServices = [];
  nodes.forEach(item => {
    Object.entries(item.traffic_history || {}).forEach(([service, history]) => {
      bandwidthServices.push({
        key: JSON.stringify([item.key, service]),
        label: nodeName(item) + " · " + service,
        history,
      });
    });
  });
  bandwidthServices.sort((a,b) => a.label.localeCompare(b.label));
  populateServiceSelect(bandwidthServices);
  const selectedBandwidth = bandwidthServices.find(item => item.key === bandwidthSelection);
  const bwHist = selectedBandwidth ? selectedBandwidth.history : [];
  const bandwidthDomain = chartDomain("chart-bandwidth", renderNow);
  const bwWindow = windowHistory(bwHist, bandwidthDomain);
  drawChart($("chart-bandwidth"), $("tip-bandwidth"), bwWindow,
    [{name:"RX (service → client)", colorVar:"--series-5", key:"rx_bps"},
     {name:"TX (client → service)", colorVar:"--series-6", key:"tx_bps"}],
    fmtBps, bandwidthDomain);
}

async function poll(){
  if(pollInFlight){ pollPending = true; return; }
  pollInFlight = true;
  pollPending = false;
  const generation = pollGeneration;
  try{
    const query = new URLSearchParams({
      queue_range: chartViews["chart-queue"] ? chartViews["chart-queue"].end-chartViews["chart-queue"].start : chartRanges["chart-queue"],
      bandwidth_range: chartViews["chart-bandwidth"] ? chartViews["chart-bandwidth"].end-chartViews["chart-bandwidth"].start : chartRanges["chart-bandwidth"],
    });
    if($("flow-service").value) query.set("flow_service", $("flow-service").value);
    if($("flow-protocol").value) query.set("flow_protocol", $("flow-protocol").value);
    if(chartViews["chart-queue"]) query.set("queue_until", String(chartViews["chart-queue"].end));
    if(chartViews["chart-bandwidth"]) query.set("bandwidth_until", String(chartViews["chart-bandwidth"].end));
    if(historyCursor !== null) query.set("history_after", String(historyCursor));
    const r = await fetch("/api/snapshot?" + query, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    if(generation !== pollGeneration) return;
    currentData = mergeSnapshot(currentData, data);
    if(data.history_cursor !== null && data.history_cursor !== undefined){
      historyCursor = Number(data.history_cursor);
    }
    render(currentData);
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("stale"));
  }catch(e){
    if(generation !== pollGeneration) return;
    document.querySelectorAll(".card").forEach(c=>c.classList.add("stale"));
    const eb = $("error-banner");
    eb.textContent = "Dashboard request failed: " + (e && e.message ? e.message : String(e));
    eb.style.display = "block";
  }finally{
    pollInFlight = false;
    if(pollPending){
      poll();
    } else {
      pollTimer = setTimeout(poll, POLL_MS);
    }
  }
}
(function initRangeSelects(){
  document.querySelectorAll(".range-select").forEach(sel => populateRangeSelect(sel));
  wireRangeSelects();
})();
poll();
window.addEventListener("resize", ()=>{ if(currentData) render(currentData); });
</script>
